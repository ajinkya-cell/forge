<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f3" media="(prefers-color-scheme: light)">
<title>Forge</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="ink.css">
</head>
<body>
<div id="offline" class="offline" role="status" hidden>
  <span class="pill red">Offline</span>
  <span id="offlineText">Can't reach the Forge server. Your changes are kept in this browser and will sync when it is back. Start it with <code>Forge.vbs</code>.</span>
</div>
<header class="top">
  <div class="top-in">
    <button class="logo" data-act="view" data-view="today">Forge</button>
    <nav id="nav" class="glass-pill" aria-label="Main">
      <span id="navInd" class="ind" aria-hidden="true"></span>
      <button data-act="view" data-view="today">Today</button>
      <button data-act="view" data-view="tasks">Tasks</button>
      <button data-act="view" data-view="board">Board</button>
      <button data-act="view" data-view="notes">Notes</button>
      <button data-act="view" data-view="progress">Progress</button>
      <button data-act="view" data-view="settings">Settings</button>
    </nav>
    <div class="top-right">
      <span id="railTimer" class="tpill mono" data-act="showTimer" role="button" tabindex="0" title="Show the timer" hidden></span>
      <span id="railLevel" class="lvl mono"></span>
      <button class="glass-btn" data-act="palette" aria-label="Search and commands (Ctrl+K)" title="Search and commands (Ctrl+K)">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      </button>
      <button class="glass-btn" data-act="theme" aria-label="Switch light and dark" title="Switch light and dark">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="frame">
  <main id="main"></main>
  <footer class="pfoot">
    <span class="mono" id="footNote">Everything stays on this computer.</span>
    <span class="hand sig" id="sig" aria-hidden="true"></span>
  </footer>
</div>

<section id="agent" class="agent" aria-label="Coach">
  <header>
    <span class="ag-av" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3 0-1.3-.6V16A2.5 2.5 0 0 1 4 13.5Z"/></svg></span>
    <div class="ag-who"><b>Forge</b><span class="mono" id="agentStatus"></span></div>
    <button class="icon" data-act="toggleAgent" aria-label="Close coach"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </header>
  <div id="chatLog" class="chat-log"></div>
  <form data-form="chat" class="chat-form">
    <textarea id="chatInput" rows="1" placeholder="Tell me what's on your plate…" aria-label="Message the coach"></textarea>
    <button id="micBtn" class="mic" type="button" data-act="micChat" aria-label="Talk to the coach (hold Alt+V)" title="Talk — or hold Alt+V" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
    </button>
    <button class="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
    </button>
  </form>
</section>
<button id="fab" class="fab" data-act="toggleAgent" aria-label="Talk to the coach (/)" aria-expanded="false" title="Talk to the coach — /">
  <svg class="i-chat" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3 0-1.3-.6V16A2.5 2.5 0 0 1 4 13.5Z"/><path d="M8.5 8.5h7M8.5 11.5h4.5"/></svg>
  <svg class="i-close" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  <i id="fabDot" class="fab-dot" hidden></i>
</button>

<dialog id="palette" class="palette">
  <input id="palInput" type="text" placeholder="Type a task, a thought, or a command…" autocomplete="off" aria-label="Command">
  <div id="palList" class="pal-list"></div>
  <div class="pal-foot mono"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> run</span><span><kbd>esc</kbd> close</span></div>
</dialog>
<dialog id="taskDialog"></dialog>
<dialog id="welcome"></dialog>
<div id="gate" class="gate" hidden></div>
<div id="toasts"></div>
<div id="recChip" class="rec-chip" role="status" hidden></div>
<script src="views.js"></script>
<script src="board.js"></script>
<script src="notes.js"></script>
<script src="timer.js"></script>
<script src="coach.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
